
name: Build BossBar Extender

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle build

      - name: Package JAR into ZIP
        run: |
          mkdir -p release
          zip -j release/BossBarExtender-1.21.1-1.21.11.zip build/libs/bossbar-extender-*.jar

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BossBarExtender-1.21.1-1.21.11
          path: release/BossBarExtender-1.21.1-1.21.11.zip
          if-no-files-found: error
